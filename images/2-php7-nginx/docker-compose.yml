version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: images/2-php7-nginx/Dockerfile
    image: itbalitimbungan/php74-nginx:latest
    container_name: php74-nginx
    ports:
      - "80:80"
      - "22:22"
    volumes:
      - ./docker:/var/www/html
    environment:
      - SSH_ROOT_PASSWORD=${SSH_ROOT_PASSWORD:-}
      - APP_ENV=${APP_ENV:-local}
    networks:
      - local-network
    restart: unless-stopped

networks:
  local-network:
    driver: bridge
