version: '3.8'

services:
  app:
    build:
      context: ../..
      dockerfile: images/1-php7-apache/Dockerfile
    image: itbalitimbungan/php74-apache:latest
    container_name: php74-apache
    ports:
      - "80:80"
      - "22:22"
    volumes:
      - ./docker:/var/www/html
    environment:
      - SSH_ROOT_PASSWORD=${SSH_ROOT_PASSWORD:-}
      - APP_ENV=${APP_ENV:-local}
    networks:
      - local-network
    restart: unless-stopped

networks:
  local-network:
    driver: bridge
